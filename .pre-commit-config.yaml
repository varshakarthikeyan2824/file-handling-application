
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy wordstat.py test_wordstat.py
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest -v
        language: system
        pass_filenames: false
